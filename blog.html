          "@type": "Question",
          "name": "What is a badge on Auvra?",
          "acceptedAnswer": { "@type": "Answer", "text": "A badge is a permanently verifiable cultural record. It can be a piece of art, a family story, a traditional recipe, a language lesson, or a craft technique." }
        },
        {
          "@type": "Question",
          "name": "What's the difference between a Collectible Badge and a Contribution Badge?",
          "acceptedAnswer": { "@type": "Answer", "text": "A Collectible Badge is meant to be owned and collected. A Contribution Badge is for records that belong to everyone, like languages and oral history, verified by the community." }
        },
        {
          "@type": "Question",
          "name": "How does Auvra ensure cultural authenticity?",
          "acceptedAnswer": { "@type": "Answer", "text": "Auvra relies on a decentralized network of community elders and verified cultural custodians to review and authenticate records." }
        },
        {
          "@type": "Question",
          "name": "Do I need to understand blockchain to use Auvra?",
          "acceptedAnswer": { "@type": "Answer", "text": "Not at all. Auvra handles all the complex technology in the background. You can use it just like any other app." }
        },
        {
          "@type": "Question",
          "name": "Can institutions and communities use Auvra?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, institutions, museums, and community organizations can create verified accounts to preserve their cultural archives." }
        }
      ]
