      <h3>How Auvra Works</h3>
      <p>Auvra is a blockchain-based platform that creates permanent, verifiable cultural records called Badges. Every badge contains the full context, provenance, and history of a cultural item, whether it's a family recipe, an oral history recording, a traditional dance, or a craft technique.</p>
