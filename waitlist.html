<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join the Auvra Waitlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 560px;
            width: 100%;
            padding: 48px 40px;
            background: #141414;
            border-radius: 24px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .logo span { color: #8b5cf6; }
        .logo a {
            color: #ffffff;
            text-decoration: none;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
            text-align: center;
        }
        .subtitle strong { color: #f3f4f6; }
        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #4b5563;
            text-align: center;
        }
        .footer-note a {
            color: #6b7280;
            text-decoration: none;
        }
        .footer-note a:hover { color: #9ca3af; }
        .thank-you {
            text-align: center;
            padding: 20px 0;
        }
        .thank-you h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .thank-you p { color: #9ca3af; line-height: 1.6; }
        .checkmark { font-size: 3rem; margin-bottom: 16px; display: block; }

        /* Tally form container */
        .tally-wrapper {
            width: 100%;
            min-height: 400px;
            background: transparent;
        }

        .tally-wrapper iframe {
            width: 100%;
            min-height: 400px;
            border: none;
            outline: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="https://goauvra.com">Auvra<span>.</span></a>
        </div>
        <h1>Join the Waitlist</h1>
        <p class="subtitle">
            Be the first to experience the <strong>permanent home for human culture</strong>.
            No spam. Just culture.
        </p>

        <!-- Tally Form -->
        <div class="tally-wrapper" id="tally-wrapper">
            <iframe
                src="https://tally.so/embed/1AB0YL?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                width="100%"
                height="400"
                frameborder="0"
                marginheight="0"
                marginwidth="0"
                title="Join the Auvra Waitlist"
                allow="camera; microphone; autoplay; encrypted-media"
            ></iframe>
        </div>

        <p class="footer-note">
            <a href="https://goauvra.com">← Back to Auvra</a>
        </p>
    </div>

    <script>
        // Listen for form submission to show thank you message
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'tally-submission') {
                document.getElementById('tally-wrapper').innerHTML = `
                    <div class="thank-you">
                        <span class="checkmark">🎉</span>
                        <h2>You are on the list!</h2>
                        <p>We will notify you the moment we launch.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
